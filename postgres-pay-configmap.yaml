apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pay-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS "Order" (
        "Id" TEXT PRIMARY KEY,
        "Data" TIMESTAMPTZ,
        "DataPagamento" TIMESTAMPTZ,
        "Status" TEXT,
        "Cliente" TEXT
    );

    CREATE TABLE IF NOT EXISTS "OrderItem" (
        "Id" TEXT PRIMARY KEY,
        "Name" TEXT,
        "Type" TEXT,
        "Price" NUMERIC,
        "OrderId" TEXT NOT NULL,
        CONSTRAINT "FK_OrderItem_Order" FOREIGN KEY ("OrderId") REFERENCES "Order" ("Id") ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS "PaymentInfo" (
        "Id" INT PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY,
        "OrderId" TEXT NOT NULL,
        "UpdateDate" TIMESTAMPTZ NOT NULL,
        "Status" TEXT NOT NULL,
        "PaymentData" TEXT,
        CONSTRAINT "FK_Payment_Order" FOREIGN KEY ("OrderId") REFERENCES "Order" ("Id") ON DELETE CASCADE
    );

    CREATE TABLE IF NOT EXISTS "DefaultAddress" (
        "Id" INT PRIMARY KEY,
        "Street" TEXT,
        "Number" TEXT,
        "Complement" TEXT,
        "Locality" TEXT,
        "City" TEXT,
        "RegionCode" CHAR(2),
        "Country" CHAR(3),
        "ZipCode" TEXT
    );

    INSERT INTO "DefaultAddress" (
        1, "Street", "Number", "Complement", "Locality",
        "City", "RegionCode", "Country", "ZipCode"
    ) VALUES (
		  'Av. Lins de Vasconcelos', '1264', NULL, 'Cambuci',
		  'São Paulo', 'SP', 'BRA', '01538001'
	  );